# Lancement : docker compose up -d   (après avoir rempli .env)
services:
  acces-trn:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/acces_trn.sqlite3
    ports:
      - "127.0.0.1:8000:8000"   # exposé au proxy HTTPS local seulement
    volumes:
      - ./data:/data
    restart: unless-stopped
