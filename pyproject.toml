[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acces-trn"
version = "0.2.0"
description = "Service d'aiguillage vers les Travailleurs de rue numériques (TRN)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "segno>=1.6",
    "python-dotenv>=1.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
acces-trn = "acces_trn.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acces_trn = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
